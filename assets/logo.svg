    <rect x="80" y="104" width="96" height="112" rx="12" fill="#ffffff"/>
    <rect x="96" y="126" width="64" height="9" rx="4.5" fill="#6366f1"/>
    <rect x="96" y="148" width="48" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="96" y="170" width="56" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="96" y="192" width="36" height="9" rx="4.5" fill="#0d9488"/>
