<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 344" width="960" height="344" role="img" aria-label="A Claude Code session hits its usage limit after saving HANDOFF.md; a Codex session reads HANDOFF.md and continues the same task.">
  <defs>
    <linearGradient id="pass" gradientUnits="userSpaceOnUse" x1="424" y1="0" x2="530" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; white-space: pre; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 13px; fill: #94a3b8; }
      .text { fill: #e2e8f0; }
      .dim { fill: #94a3b8; }
      .soft { fill: #cbd5e1; }
      .prompt { fill: #2dd4bf; }
      .done { fill: #818cf8; }
      .save { fill: #2dd4bf; }
      .stop { fill: #f87171; }
      .caption { font-size: 14px; fill: #64748b; }
    </style>
  </defs>

  <!-- left: the session that dies -->
  <rect x="10" y="10" width="400" height="280" rx="12" fill="#0f172a" stroke="#334155"/>
  <rect x="10" y="10" width="400" height="34" rx="12" fill="#1e293b"/>
  <rect x="10" y="30" width="400" height="14" fill="#1e293b"/>
  <circle cx="32" cy="27" r="5" fill="#f87171"/>
  <circle cx="50" cy="27" r="5" fill="#fbbf24"/>
  <circle cx="68" cy="27" r="5" fill="#34d399"/>
  <text x="210" y="32" text-anchor="middle" class="sans title">Claude Code</text>

  <text x="30" y="80" class="mono"><tspan class="prompt">&gt;</tspan><tspan class="text"> Add Stripe checkout to the cart</tspan></text>
  <text x="30" y="110" class="mono"><tspan class="done">●</tspan><tspan class="soft"> Edited src/routes/checkout.ts</tspan></text>
  <text x="30" y="136" class="mono"><tspan class="done">●</tspan><tspan class="soft"> Ran npm test   12 passed</tspan></text>
  <text x="30" y="162" class="mono"><tspan class="done">●</tspan><tspan class="soft"> Wired up the receipt email</tspan></text>
  <text x="30" y="188" class="mono"><tspan class="save">●</tspan><tspan class="soft"> Saved </tspan><tspan class="save">HANDOFF.md</tspan></text>
  <rect x="26" y="222" width="368" height="36" rx="8" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-opacity="0.5"/>
  <text x="40" y="245" class="mono"><tspan class="stop">●</tspan><tspan class="stop"> Usage limit reached · resets 17:30</tspan></text>

  <!-- the pass -->
  <path d="M424 150 H530" stroke="url(#pass)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <polygon points="540,150 527,142 527,158" fill="#0d9488"/>
  <g transform="translate(461 98) rotate(-5 17 21)">
    <rect width="34" height="42" rx="5" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="7" y="9" width="20" height="4" rx="2" fill="#6366f1"/>
    <rect x="7" y="18" width="15" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="7" y="27" width="18" height="4" rx="2" fill="#0d9488"/>
  </g>
  <text x="480" y="182" text-anchor="middle" class="mono" style="font-size:12.5px" fill="#0d9488">HANDOFF.md</text>

  <!-- right: the agent that continues -->
  <rect x="550" y="10" width="400" height="280" rx="12" fill="#0f172a" stroke="#334155"/>
  <rect x="550" y="10" width="400" height="34" rx="12" fill="#1e293b"/>
  <rect x="550" y="30" width="400" height="14" fill="#1e293b"/>
  <circle cx="572" cy="27" r="5" fill="#f87171"/>
  <circle cx="590" cy="27" r="5" fill="#fbbf24"/>
  <circle cx="608" cy="27" r="5" fill="#34d399"/>
  <text x="750" y="32" text-anchor="middle" class="sans title">Codex</text>

  <text x="570" y="80" class="mono"><tspan class="prompt">&gt;</tspan><tspan class="text"> Read HANDOFF.md and continue</tspan></text>
  <text x="570" y="110" class="mono"><tspan class="dim">Goal     </tspan><tspan class="text">Stripe checkout + receipt</tspan></text>
  <text x="570" y="136" class="mono"><tspan class="dim">Stopped  </tspan><tspan class="text">receipt template unfinished</tspan></text>
  <text x="570" y="162" class="mono"><tspan class="dim">Next     </tspan><tspan class="text">fill in the receipt email</tspan></text>
  <text x="570" y="188" class="mono"><tspan class="dim">Repo     </tspan><tspan class="text">3 changed, tests pass</tspan></text>
  <text x="570" y="245" class="mono"><tspan class="save">●</tspan><tspan class="soft"> Editing src/emails/receipt.html</tspan></text>
  <rect x="824" y="234" width="8" height="15" fill="#2dd4bf"/>

  <text x="210" y="322" text-anchor="middle" class="sans caption">A limit ends the session mid-task</text>
  <text x="750" y="322" text-anchor="middle" class="sans caption">Any other agent continues in seconds</text>
</svg>
