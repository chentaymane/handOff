[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-app"
version = "1.1.0"
description = "Keeps HANDOFF.md current from your coding agents' session logs, so the work survives context limits, credit limits and crashes."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
keywords = ["claude-code", "codex", "cursor", "gemini-cli", "opencode", "qwen-code", "copilot-cli", "aider", "freebuff", "codebuff", "ai-agents", "handoff", "developer-tools"]

[project.scripts]
handoff = "handoff.cli:main"

[project.urls]
Homepage = "https://github.com/chentaymane/handoff"

[tool.setuptools]
packages = ["handoff", "handoff.sources"]

[tool.setuptools.package-data]
handoff = ["dashboard.html"]
